  status: witnessed
  witness_evidence: 'PARTIAL-RESOLVED to the primitive level: the display PRIMITIVE a framebuffer X server needs -- a guest program writing an RGBA framebuffer that the host displays -- is now PROVEN end-to-end (CI 26594035720 step 11 + local test 19/19: guest fbtest mmaps + paints gradient + registers via syscall 0x5fb, host reads it zero-copy via spy_address). The narrower question ''does a FULL Xfbdev/kdrive X server run at USABLE SPEED under SSE2 NOJIT'' remains empirically open until a real X binary is exec''d under blink -- that is the guest-display-producer + guest-rootfs-x11 PRD rows. The pipeline is no longer the unknown; only the weight/speed of a full X server is. Threads (-pthread) are now available, giving a worker+SAB path for off-main-thread VM execution to keep the UI responsive. Reframe: the desktop-display path is viable; remaining work is choosing the leanest in-guest producer.'
- id: pipe-is-build-flag
  question: Is pipe()=EBADF caused by configure --disable-all dropping a feature, or a missing syscall in blink C requiring real impl?
  status: witnessed
  witness_evidence: '/tmp/blinkfork/blink/syscall.c:5281 static int SysPipe(struct Machine*,i64); registered syscall.c:5642 SYSCALL(1,0x016,''pipe'',SysPipe) and :5644 pipe2. configure:311-317 --disable-all sets DISABLE_NONPOSIX/THREADS/SOCKETS/FORK. configure also offers --enable-threads/--enable-jit/--enable-fork. Conclusion: pipe EBADF is the --disable-all preset, fixable via build flags not C.'
- id: fb-mmap-vs-fixed-region
  question: 'Best mechanism to expose guest framebuffer to host: real mmap of a device file, or a fixed reserved BSS region with a known exported symbol address?'
  status: witnessed
  witness_evidence: 'blinkenlib.c:479-481 EMSCRIPTEN_KEEPALIVE u8* blinkenlib_spy_address(u64 vaddr){return SpyAddress(m,vaddr);} returns host pointer into guest virtual memory. Already used internally blinkenlib.c:181-182. Decision: guest mmaps a framebuffer and exposes its vaddr; host calls spy_address to get zero-copy host view. No custom device needed.'
