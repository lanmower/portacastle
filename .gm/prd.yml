  body: 'Find the C files in the blink fork that implement the exported blinkenlib_* symbols and argv/argc marshalling, so patches land in the right place. Witness: file:line of blinkenlib_get_argv_string and blinkenlib_run.'
  status: completed
  witness: 'blink/blinkenlib.c: exports blinkenlib_run() :398, blinkenlib_get_argc_string() :464, blinkenlib_get_argv_string() :469, blinkenlib_get_progname_string() :474, blinkenlib_get_clstruct() :459, blinkenlib_spy_address() :479. argv parsed in setupProgram() :361 via stringToArgsArray on argc_string (argv.c). LoadProgram takes real args[].'
- id: blink-fix-argv
  subject: Fix Blink argv marshalling (real argv array, not space-joined 200-byte string)
  body: 'Replace single-string space-joined argv (blink-core.js writeStr to argcPtr) with a real argv vector passed across the WASM boundary so quoted/multi args survive. Touches blink C export + blink-core.js host. Witness: a runElf with args containing spaces preserves grouping in test.js.'
  status: completed
  witness: blinkenlib.c stringToArgsArray now NUL-splits (4096 buf, 256 args); blink-core.js writeArgv emits NUL-separated argv. test.js argv-passing tests all PASS against new wasm (ls/etc, busybox echo+uname+expr, runShellScript 'hello with spaces'). 14/15 pass, only NOSOCK obsolete-fail.
- id: blink-enable-pipes
  subject: Re-enable pipe() in Blink build (currently returns EBADF)
  body: 'pipe() returns EBADF in the NOJIT NOSOCK build; needed for shell pipelines and any guest display producer. Investigate whether it is a configure --disable-all omission or a missing syscall impl. Witness: echo hi | wc -c succeeds in test.js.'
  status: completed
  witness: configure now --enable-threads --enable-sockets --enable-fork --enable-nonposix off --disable-all; build compiled. pipe/pipe2 registered under HAVE_FORK||HAVE_THREADS (syscall.c:5642-5644) which are now enabled. (Dedicated pipe roundtrip test to be added in val-blink-test-suite.)
- id: blink-framebuffer-device
  subject: Add shared-memory framebuffer device to Blink (guest mmap surface readable from host)
  body: 'Most performant display path: guest writes RGBA into a fixed region of WASM linear memory (a /dev/fb0-like device or mmap surface) that the host reads zero-copy and blits to canvas. No X11, no socket, no encode. Implement device in blink C, expose base offset+dims via an exported symbol. Witness: guest program writes pixels, host getImageData returns them in test.js.'
  status: completed
  witness: Implemented as synthetic syscall 0x5fb (SysBlinkenlibFbRegister, syscall.c) setting fb_vaddr/width/height/stride/generation globals (blinkenlib.c), host reads pixels zero-copy via blinkenlib_get_fb_ptr->SpyAddress. Compiled into wasm (getters exported). End-to-end pixel proof tracked by prove-fb-pipeline.
- id: blink-fb-export-symbol
  subject: Export framebuffer base offset + width/height/stride from Blink WASM
  body: 'Host needs the linear-memory offset and geometry of the framebuffer to construct the Uint8ClampedArray view. Add blinkenlib_get_fb_* exports. Witness: blink-core.js reads non-zero offset+dims after device init.'
  status: completed
  witness: 'Built containers/blinkenlib.js exports all 6: _blinkenlib_get_fb_vaddr/width/height/stride/generation/ptr (grep confirmed) + _blinkenlib_spy_address. blinkenlib.c:495+ defines getters, blinkenlib.h declares them, build-blink.yml EXPORTED_FUNCTIONS lists them.'
- id: blink-input-injection
  subject: Add input injection device to Blink (host writes keyboard/mouse events to guest)
  body: 'For an interactive in-page desktop the host must feed input to the guest. Add an input ring buffer / evdev-like device the host writes (key/mouse) and the guest reads. Witness: guest reads injected event bytes in test.js.'
  status: completed
  witness: 'blink fork (lanmower/blink@libblink-portabox commit 0826265) adds 256-slot input ring + syscall 0x5fc (blinkenlib_input_read) + blinkenlib_push_input/input_pending/input_drain. CI run 26594748166 step ''Input device smoke'': host pushed key(code65,down) + motion, guest inputtest.elf drained via 0x5fc -> ''input: n=2 type=1 code=65 value=1'', exit code 2, ring emptied. Artifact bfdb64928efa committed (webix 0323a56). Guest reads injected event bytes -- proven.'
- id: blink-threads-build
