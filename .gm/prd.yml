- id: blink-jit-wasm-risk
  subject: De-risk JIT-under-WASM build (--enable-jit) or fall back to NOJIT if unstable
  body: 'User chose max-perf incl JIT. JIT generating native code under emscripten/WASM is the riskiest flag (WASM has no runtime codegen by default; Blink JIT emits x86 host code which doesn''t exist in WASM). Investigate whether Blink''s JIT supports a WASM/portable backend; if not, JIT is infeasible under emscripten -> document and fall back to threads+sockets NOJIT (still max practical perf). Witness: build result with --enable-jit, or evidence JIT requires native host.'
  status: completed
  witness: 'Resolved: JIT excluded from build (no --enable-jit), NOJIT build compiled+smoke-passed. jit.c:56 proves JIT is native-arch-only, infeasible under wasm32. Fallback (threads+sockets NOJIT) is what shipped. Superseded by jit-impossible-wasm-finalized.'
- id: jit-impossible-wasm-finalized
  subject: 'FINALIZED: JIT is impossible under WASM; max-perf profile = threads+sockets+pipes+fork NOJIT'
  body: 'jit.c:56 ''This JIT only supports x86-64 and aarch64''; backend guarded by #if defined(__x86_64__)/__aarch64__ (jit.c:637,1429,...). emscripten target is wasm32 so JIT_POSSIBLE is unset (configure:537). Therefore --enable-jit cannot apply in-browser. Achievable max-perf = --enable-threads --enable-sockets --enable-fork + pipes, NOJIT. This supersedes the JIT half of the user''s max-perf choice (physical constraint, not preference). Witness: jit.c:56 + arch guards.'
  status: completed
  witness: 'Confirmed by build: configure log ''checking for pthreads... no'' and successful NOJIT compile; jit.c:56 restricts JIT to x86-64/aarch64. Build profile finalized as threads(config)+sockets+fork+nonposix NOJIT. Documented; no JIT flag used.'
- id: blink-emscripten-pthread
  subject: 'DISCOVERY: emscripten -pthread not enabled (configure ''pthreads no''); real threads need explicit -pthread build'
  body: 'Build log shows ''checking for pthreads... no'' despite --enable-threads. Blink''s --enable-threads toggles its internal threading code but emscripten pthreads (SharedArrayBuffer-backed) needs -pthread + -sPTHREAD_POOL_SIZE + -sSHARED_MEMORY in EFLAGS, plus COOP/COEP at serve time. Without it the VM is single-threaded -> concurrent GUI(X server)+CLI(terminal) blocked by blink-core single-run guard (edge-overlapping-runelf). Most-performant requires this. Add -pthread to build-blink.yml and re-build; verify SAB threads work. Risk: pthreads is the most build-breaking emscripten flag (worker bootstrap, async). Witness: configure ''pthreads yes'' + threaded smoke passes.'
  status: completed
  witness: 'Resolved: emscripten -pthread now enabled AND verified. Root cause was that Blink''s configure compile+run probes can''t run wasm natively (so reported pthreads=no and force-disabled threads). Fixed by force-patching config.h post-configure. CI 26594035720 step 6 force-defines success + step 7 threaded link success + step 10 threaded smoke ok. blinkenlib.wasm 3b9351bb7d1c is the threaded artifact.'
- subject: 'FORCE-DEFINES: post-configure patch config.h to enable threads (probes can''t run under emconfigure)'
  body: 'Root cause confirmed (configure:261-262): config() does `compile && run o/tool/config/X` -- under emconfigure the test compiles to wasm and the run step can''t execute natively, so EVERY feature probe returns ''no''. Worse, configure:508-511 the pthread-probe FAILURE actively runs `uncomment ''#define DISABLE_THREADS''`, force-disabling threads even with --enable-threads. Fix: after emconfigure ./configure, post-process the generated config.h with sed to (a) re-comment DISABLE_THREADS (enable threads), (b) uncomment the HAVE_* that emscripten musl genuinely provides: HAVE_PIPE2, HAVE_DUP3, HAVE_MAP_SHARED, HAVE_MAP_ANONYMOUS, HAVE_SCHED_YIELD, HAVE_SCHED_H, HAVE_GETENTROPY, HAVE_CLOCK_SETTIME, HAVE_STRCHRNUL, HAVE_MEMCCPY, HAVE_REALPATH, HAVE_SEEKDIR, HAVE_PREADV, HAVE_VASPRINTF. Leave HAVE_FORK OFF (emscripten has no real fork; recorded). Add the patch step to build-blink.yml between configure and make. Witness: built config.h shows DISABLE_THREADS commented + HAVE_PIPE2 uncommented; threaded smoke passes.'
  tags:
  - blink
  - build
  - threads
  - config
  id: force-defines-post-configure-patch-config-h-to-enable-threads-pr
  status: completed
  witness: 'build-blink.yml step ''Force feature defines'' patches config.h after emconfigure: sed re-comments DISABLE_THREADS + uncomments HAVE_PIPE2/DUP3/MAP_SHARED/etc, with a hard gate failing if DISABLE_THREADS survives. CI 26594035720 step 6 SUCCESS, downstream threaded link green. HAVE_GETRANDOM/HAVE_SYSINFO correctly excluded (emscripten musl lacks them).'
- subject: 'BUILD-FINDING: threaded link SUCCEEDS; only HAVE_GETRANDOM/HAVE_SYSINFO over-eager (emscripten musl lacks them)'
  body: 'CI build 26593615578 (sha 0f5acf8): config.h force-defines step (step 6) succeeded -- threads enabled. Compile step 7 got ALL THE WAY to wasm-ld link with full pthread machinery (--shared-memory, --import-memory, -lc-mt-debug, -ldlmalloc-mt, -lsockets-mt, _emscripten_thread_init etc. all present and resolved). It failed ONLY on `undefined symbol: getrandom` and `undefined symbol: sysinfo` -- because my force-defines wrongly enabled HAVE_GETRANDOM + HAVE_SYSINFO, which emscripten musl does not export. Removed those two from the patch list (getentropy IS provided and covers randomness). This PROVES the -pthread threaded build is viable -- the threads/SAB toolchain links cleanly. Re-push to confirm a green threaded artifact. Witness: next build links + node smoke passes with the threaded wasm.'
  tags:
  - blink
  - build
  - threads
  - link
  - finding
  id: build-finding-threaded-link-succeeds-only-have-getrandom-have-sy
  status: completed
  witness: 'Acted on: removed HAVE_GETRANDOM/HAVE_SYSINFO from force-defines (commit 0a2ebdf); subsequent build 26594035720 linked + ran green. Finding confirmed and resolved.'
- subject: 'FORK-REALITY: shell pipelines (sh -c ''a|b'') cannot work under emscripten (no fork); pipe() syscall itself works'
  body: 'emscripten has NO fork() (recorded). HAVE_FORK left OFF in config.h. Therefore busybox `sh -c ''echo hi | wc -c''` cannot run -- it forks for each pipeline stage. test.js line 179 ''pipes enabled'' test asserting pipeline output /3/ WILL FAIL against any build (fork unavailable), so it is testing an impossible capability. FIX: change that test to assert the realistic surface -- either (a) pipe()/pipe2() syscall returns valid non-negative FDs in-process (not EBADF), or (b) drop the pipeline assertion and document pipelines as fork-blocked. Most-performant concurrency for GUI+CLI is cooperative scheduling (edge-overlapping-runelf), NOT fork. Witness: adjusted test passes + capabilities.pipes reflects single-process-pipe-only reality.'
  tags:
  - blink
  - fork
  - pipes
  - test
  - reality
  id: fork-reality-shell-pipelines-sh-c-a-b-cannot-work-under-emscript
  status: completed
  witness: 'Acted on: test.js ''pipes enabled'' test changed to assert pipe() is not ENOSYS rather than a full pipeline (commit 69c16ce); capabilities now expose pipe:true/pipelines:false/fork:false (bff1f16); AGENTS.md documents pipelines need fork which emscripten lacks. 19/19 pass. Reality captured in code+docs+tests.'
- subject: 'WORKER-SCHEDULING: live desktop needs VM-in-worker so host pushes input + reads fb while guest runs continuously'
  body: 'The input ring (0x5fc) and fb register (0x5fb) primitives are done, but runElf() is SYNCHRONOUS and single-run-guarded -- it blocks the JS thread until the guest exits. For a live desktop the X server runs forever, so: (1) the main thread can''t push input mid-run, (2) can''t run terminal commands concurrently, (3) the rAF blit loop can''t paint because the thread is blocked in runElf. SOLUTION (now unblocked by the -pthread build): run the blink VM in a Web Worker with the shared WASM memory; the UI thread does fb blits (reading shared memory zero-copy) + posts input events into the ring (shared memory, lock-free SPSC) without blocking. The worker runs the long-lived X server; a second cooperative path or message handles terminal runCommand. This is the edge-overlapping-runelf resolution and the most-performant desktop architecture. Witness: VM in worker, UI thread blits a live framebuffer + forwards input while the guest runs, terminal command returns concurrently. Subtasks: worker bootstrap module, SAB-backed input ring (or keep C ring + postMessage), runElf->worker RPC, blink-core single-run-guard relaxed per-worker.'
  tags:
  - blink
  - worker
  - threads
  - scheduling
  - desktop
  - architecture
  id: worker-scheduling-live-desktop-needs-vm-in-worker-so-host-pushes
  status: pending
