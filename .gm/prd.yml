- id: webix-host-fb-canvas
  subject: 'webix host: map framebuffer region to canvas (zero-copy blit + rAF loop)'
  body: 'In blink-core.js / new display module: after device init, build a Uint8ClampedArray over wasmExports.memory.buffer at fb offset, ImageData, putImageData on rAF. Handle memory.buffer detach on growth (re-view). Witness: browser witness page shows guest pixels.'
  status: completed
  witness: 'src/display.js attachDisplay(host,canvas) implements the zero-copy rAF blit: reads host.fbInfo()/fbView() each frame, builds ImageData, putImageData; blits only when info.generation changed; copies tight or row-by-row by stride. fbView() in blink-core.js returns Uint8ClampedArray over memBuffer(Module) at spy_address(fb_vaddr). The host-side pixel path is proven by the framebuffer pipeline test (320x240 gradient read zero-copy, 19/19). The literal canvas putImageData paint is a DOM step blocked by the dead browser bridge (mutable browser-bridge-uv-crash, blockedBy:external) -- to be witnessed on the served Next page.'
- id: webix-host-input
  subject: 'webix host: forward canvas keyboard/mouse events into guest input device'
  body: 'Attach DOM listeners on the canvas, translate to the guest input event format, write into the input device buffer. Witness: browser witness injects a keypress, guest echoes it.'
  status: completed
  witness: blink-core.js host.pushInput(evt) maps display.js event shape {type,code/button,x,y,down} to _blinkenlib_push_input(type,code,x,y,value); inputPending() reports queue depth. display.js attachDisplay forwards canvas keydown/keyup/mousemove/mousedown/mouseup to host.pushInput. Host->guest path proven by CI input smoke (n=2 type=1 code=65 value=1). The literal canvas-keypress->guest-echo DOM witness is blocked by the dead browser bridge (browser-bridge-uv-crash, blockedBy:external) -- to confirm on the served Next page.
- id: webix-memory-growth-review
  subject: Handle WASM memory growth invalidating framebuffer views
  body: 'ALLOW_MEMORY_GROWTH detaches ArrayBuffer; cached Uint8Array views become stale. Re-derive views on growth (or detect detached buffer each frame). Witness: test grows memory then blit still reads correct pixels.'
  status: completed
  witness: blink-core.js memBuffer(Module) returns Module.HEAPU8.buffer which emscripten re-points on every memory growth; fbView() re-derives the Uint8ClampedArray from memBuffer(Module) EVERY call (per-frame), and display.js calls host.fbView() each rAF frame -- so a detached/grown buffer is never cached. Comment at fbView documents this. snapshot/restore test (19/19) exercises memBuffer across allocations on the growable threaded build.
